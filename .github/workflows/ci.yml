name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build-validate:
    name: Test, Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python modules
        run: python -m compileall fkip scripts dags tests alembic

      - name: Validate Docker Compose configuration
        run: docker compose -p fkip config

      - name: Validate Docker build
        run: docker build -t fkip-ci:latest .

      - name: Validate Alembic migration script generation
        run: alembic upgrade head --sql
