services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.docker.example
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env.docker.example
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run fkip/interfaces/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      FKIP_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: financial_intelligence
      POSTGRES_USER: fkip
      POSTGRES_PASSWORD: fkip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fkip -d financial_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
